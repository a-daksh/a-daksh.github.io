# Build the site and publish it to the gh-pages branch (which GitHub Pages serves) on every push to main.
# Manual runs: Actions tab -> "Deploy site" -> Run workflow.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          HUSKY: 0 # no git hooks in CI

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          GATSBY_TELEMETRY_DISABLED: 1

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # adds .nojekyll so GitHub Pages serves files/folders that start with "_"
          enable_jekyll: false
          commit_message: 'deploy: ${{ github.sha }}'
